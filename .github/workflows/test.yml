name: test

# Reusable workflow, not directly triggered — called by ci.yml (every PR and
# push to main) and release.yml (every tag push, as a fresh check against
# the exact tagged commit before building anything). Keeping this in one
# place means the two callers can't drift out of sync with each other.
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - run: npm ci

      - name: Cache pinned CLI sidecars
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecars-${{ hashFiles('src-tauri/binaries/vendor-manifest.json') }}

      - name: Fetch + verify all pinned sidecars, run the full verify gate
        run: npm run verify

      - name: Validate release tag matches every version field
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          ok=true
          for pair in "package.json:$pkg_version" "src-tauri/tauri.conf.json:$tauri_version" "src-tauri/Cargo.toml:$cargo_version"; do
            file="${pair%%:*}"
            version="${pair#*:}"
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match ${file}'s version (v${version})."
              ok=false
            fi
          done
          $ok || {
            echo "All three version fields (package.json, src-tauri/tauri.conf.json, src-tauri/Cargo.toml)"
            echo "must exactly match the tag (without the leading v in the files themselves)."
            echo "Bump whichever is out of sync and retag, or delete and repush the correct tag."
            exit 1
          }
