name: release

# Only a tag push or a manual dispatch (the latter for a pre-tag confidence
# check across all three platforms — see RELEASING.md). Re-runs test.yml
# against the exact tagged commit before building anything, rather than
# trusting that ci.yml already passed on main at merge time.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs inside a Fedora 42 container on the ubuntu-24.04
          # runner — not ubuntu-24.04 directly — because linuxdeploy bundles
          # whatever GTK/WebKit/libepoxy shared libraries exist on the build
          # machine into the AppImage. Confirmed the hard way: an
          # ubuntu-24.04-built AppImage reproducibly failed to launch on a
          # real Intel Iris Xe / Mesa 26.1.4 machine with `Could not create
          # default EGL display: EGL_BAD_PARAMETER`, while the exact same
          # source built in the Fedora 42 toolbox this repo's own dev
          # workflow already uses (scripts/dev.sh, AGENT.md) launched fine
          # on that same machine — verified directly by diffing the bundled
          # webkit2gtk-4.1/gtk3/libepoxy binaries between the two builds
          # (genuinely different sizes, i.e. different upstream versions,
          # not just a stripping difference — NO_STRIP=1 alone did not fix
          # this on its own; see the git history for that dead end). Fedora
          # 42 specifically because that's this repo's own toolbox's
          # version — matching the environment that's actually confirmed
          # working, not picked arbitrarily.
          - name: linux-x64
            runner: ubuntu-24.04
            container: fedora:42
            target: x86_64-unknown-linux-gnu
            command: build:linux
          - name: windows-x64
            runner: windows-2025
            container: ""
            target: x86_64-pc-windows-msvc
            command: build:windows
          - name: macos-arm64
            runner: macos-15
            container: ""
            target: aarch64-apple-darwin
            command: build:macos
    runs-on: ${{ matrix.runner }}
    # Empty string (the windows/macos matrix entries) means "no container" —
    # GitHub Actions runs the job directly on `runs-on` in that case.
    container: ${{ matrix.container }}
    steps:
      # Package names/versions confirmed directly against this exact image
      # (podman run fedora:42) before wiring into CI — not guessed from the
      # toolbox's dnf list, which also installs rust/cargo/nodejs/npm/go
      # that this job gets from dtolnay/rust-toolchain and actions/setup-node
      # instead. Must run before actions/checkout below: bare fedora:42 has
      # no `git`, which checkout needs. `xdg-utils` is for the AppImage
      # bundler (`failed to bundle project: xdg-open binary not found`
      # without it) — neither is in AGENT.md's toolbox list since the host
      # there already has them.
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make pkgconf-pkg-config \
            webkit2gtk4.1-devel gtk3-devel librsvg2-devel openssl-devel \
            libappindicator-gtk3-devel patchelf file curl wget git \
            rpm-build xdg-utils

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Cache pinned CLI sidecars
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: sidecars-${{ matrix.target }}-${{ hashFiles('src-tauri/binaries/vendor-manifest.json') }}

      # Unsigned builds: no Apple notarization or Windows Authenticode cert
      # wired in yet. Installers work, but macOS shows a Gatekeeper warning
      # and Windows shows a SmartScreen "unknown publisher" prompt. Worth
      # doing before a real public release — see the note in RELEASING.md.
      #
      # `npm run build:linux` sets NO_STRIP=1 itself (in package.json) — this
      # repo's AGENT.md already documented that the Fedora toolbox's binutils
      # *fails the build outright* without it (can't parse a bundled
      # library's `.relr.dyn` section), and the Fedora 42 container this job
      # now uses hits the same issue. This was tried as a fix for the real
      # `EGL_BAD_PARAMETER` runtime crash first (on the theory that
      # ubuntu-24.04's own strip silently corrupted something instead of
      # erroring) — it wasn't; still needed for the build to succeed here,
      # but the actual runtime fix was the `container:` switch on this
      # matrix entry above, not this.
      - name: Build the native installer
        run: npm run ${{ matrix.command }}

      - name: Generate SHA-256 checksums
        run: node scripts/checksums.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: omnideck-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    # Two environments, not one: "release" (stable tags, no "-" suffix)
    # requires a review before it runs — "release-preview" (alpha/beta/rc,
    # anything with a "-" suffix, same test contains() expects as the
    # `prerelease:`/`make_latest:` inputs below) has no protection rules, so
    # prerelease tags publish unattended. Configured directly via the GitHub
    # API (repos/omnideck-dev/desktop/environments/{release,release-preview}),
    # not in this file — see RELEASING.md.
    environment: ${{ contains(github.ref_name, '-') && 'release-preview' || 'release' }}
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: omnideck-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # Static contract on the build artifacts, before anything is attested
      # or published: exact 5-artifact matrix, per-format magic bytes, and
      # every checksum matches its file. Catches a corrupted/truncated/
      # wrong-architecture artifact — fail_on_unmatched_files below only
      # catches a totally missing one. See tests/releasecontract/README.md.
      - name: Verify the release artifact contract
        run: |
          node tests/releasecontract/verify-release.mjs \
            --directory dist \
            --version "${GITHUB_REF_NAME}" \
            --report artifacts/desktop-release-contract/report.json

      - name: Upload the release contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-contract-report
          path: artifacts/desktop-release-contract/
          if-no-files-found: warn

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/**/*

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          name: Omnideck ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
