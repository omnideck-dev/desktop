name: ci

# Runs on every PR and push to main — source checks only (test.yml). No
# installer builds here; those only happen on a tag push or manual dispatch
# — see release.yml.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
